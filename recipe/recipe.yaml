context:
  version: "3.10.0"

package:
  name: scala3
  version: ${{ version }}

source:
  - git: https://github.com/lampepfl/dotty
    tag: ${{ version }}
  - url: https://github.com/scala/scala3/archive/refs/tags/${{ version }}.tar.gz
    sha256: 0ad55a264ce9f96282ec7fb336c78db078d271eb5565318f119106bfa468341d
    target_directory: archive

build:
  number: 0
  noarch: generic

requirements:
  build:
    - findutils
    - maven
    - sbt
    - sed
    - openjdk >=17,<18
    - unzip
  run:
    - openjdk

tests:
  - script:
      - scala --help

about:
  license: Apache-2.0
  license_file:
    - LICENSE
    - target/generated-resources/licenses/
  summary: The Scala 3 compiler, also known as Dotty.
  homepage: https://dotty.epfl.ch
  repository: https://github.com/lampepfl/dotty

extra:
  recipe-maintainers:
    - danielnachun
